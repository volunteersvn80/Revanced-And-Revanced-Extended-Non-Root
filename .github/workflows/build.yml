name: Build ReVanced APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct URL to YouTube APK (để trống nếu dùng link mặc định)'
        required: false
        default: 'https://dw.uptodown.net/dwn/29Lxcs2gnl0KT5Y60nlhSjgssXXsml2u19cvB4zYDlkjpQLwqhyiKMy-BdmsP_-S23is-DbMqQmMnZEN3RLYBLJoT8DNdIbTpRJj9hXrTjpuaB6srTrfv5v7KjFXrvzG/nTpDWFqM-zPQ6t7g3Q2uqxzoXHybBVdv6YLnYW2GUFSKrtiNJ-4RYbgvVYyZXG4awaAMq-2DMoyXlsEMI3af3LUdhi1FVflUmDg_OXLFtfD7AZjBWVUT-wHaUyVQu53p/8wE5jpcXuPO-o0gMhHk0Vmajplhsa23rHE2ZY1d2uEBqjwpYR942IxXDh6U3Tqw8shAN5it4kO4Ue0pSISy26Q==/youtube-21-34-243.apk'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Tools & Patch
        run: |
          mkdir -p build && cd build

          # Tải CLI & Patches mới nhất
          CLI_URL=$(curl -s https://api.github.com/repos/ReVanced/revanced-cli/releases/latest | grep "browser_download_url.*\.jar" | cut -d : -f 2,3 | tr -d \")
          PATCHES_URL=$(curl -s https://api.github.com/repos/ReVanced/revanced-patches/releases/latest | grep "browser_download_url.*\(jar\|rvp\)" | head -n 1 | cut -d : -f 2,3 | tr -d \")

          curl -sL "$CLI_URL" -o revanced-cli.jar
          curl -sL "$PATCHES_URL" -o revanced-patches.jar

          # Tải APK kèm User-Agent giả lập trình duyệt để tránh bị Uptodown chặn
          APK_URL="${{ github.event.inputs.apk_url }}"
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$APK_URL" -o base.apk

          # Kiểm tra file APK tải về
          if [ ! -s base.apk ] || file base.apk | grep -q 'HTML'; then
            echo "::error::Link APK bị lỗi, hết hạn hoặc bị chặn tải."
            exit 1
          fi

          # Patch APK
          java -jar revanced-cli.jar patch \
            --patch-bundle revanced-patches.jar \
            --out revanced-output.apk \
            base.apk

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: ReVanced-APK
          path: build/revanced-output.apk
