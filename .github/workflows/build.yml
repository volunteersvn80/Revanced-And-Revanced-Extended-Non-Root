name: Build ReVanced APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Download Tools & Patch
        run: |
          mkdir -p build && cd build
          
          # 1. Tải CLI, Patches, Integrations mới nhất
          CLI_URL=$(curl -s https://api.github.com/repos/ReVanced/revanced-cli/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url')
          PATCHES_URL=$(curl -s https://api.github.com/repos/ReVanced/revanced-patches/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url')
          INTEGRATIONS_URL=$(curl -s https://api.github.com/repos/ReVanced/revanced-integrations/releases/latest | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url')

          curl -sL "$CLI_URL" -o revanced-cli.jar
          curl -sL "$PATCHES_URL" -o revanced-patches.jar
          curl -sL "$INTEGRATIONS_URL" -o revanced-integrations.apk

          # 2. Tải file APK YouTube tương thích từ nguồn APKMirror/Archive
          # Lưu ý: Thay URL bên dưới bằng link trực tiếp tới file YouTube base APK tương ứng nếu bạn có link riêng
          curl -sL "https://data.winudf.com/APK/Y29tLmdvb2dsZS5hbmRyb2lkLnlvdXR1YmVfMTU2MTI5Mjk2Ml8yN2MyNGRjYw?_p=Y29tLmdvb2dsZS5hbmRyb2lkLnlvdXR1YmU%3D&download_id=no_1190507092319381&filename=YouTube_21.34.243_APKPure.apk&full_size=203765282&is_hot=true&k=8613a5de2f0c572530d5d2bebe6e3f946a945f38&package_name=com.google.android.youtube&source=web&token=1787935800-e9e6040102-0-15fde03514f4f3ec478b3fad07c16c33" -o base.apk

          # 3. Tiến hành Patch
          java -jar revanced-cli.jar patch \
            -p revanced-patches.jar \
            -m revanced-integrations.apk \
            -o revanced-output.apk \
            base.apk

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: ReVanced-APK
          path: build/revanced-output.apk
